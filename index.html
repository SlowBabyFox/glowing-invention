<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jcsylvan.ai</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background-color: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 640px;
      padding: 2rem;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      font-weight: 300;
      letter-spacing: 0.15em;
      color: #ffffff;
      margin-bottom: 3rem;
    }

    .prompt-wrapper {
      position: relative;
      width: 100%;
    }

    .prompt-input {
      width: 100%;
      padding: 1rem 3.5rem 1rem 1.25rem;
      font-size: 1rem;
      font-family: inherit;
      background-color: #141414;
      color: #e0e0e0;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .prompt-input::placeholder {
      color: #555555;
    }

    .prompt-input:focus {
      border-color: #505050;
    }

    .submit-btn {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #555555;
      cursor: pointer;
      padding: 0.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s ease;
    }

    .submit-btn:hover {
      color: #e0e0e0;
    }

    .submit-btn svg {
      width: 20px;
      height: 20px;
    }

    .footer {
      position: fixed;
      bottom: 1.5rem;
      font-size: 0.75rem;
      color: #333333;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>jcsylvan.ai</h1>
    <form class="prompt-wrapper" onsubmit="handleSubmit(event)">
      <input
        type="text"
        class="prompt-input"
        placeholder="Ask anything..."
        autofocus
        aria-label="Prompt"
      />
      <button type="submit" class="submit-btn" aria-label="Submit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </form>
  </div>
  <div class="footer">&copy; 2026 jcsylvan.ai</div>
  <script>
    function handleSubmit(e) {
      e.preventDefault();
      const input = e.target.querySelector('.prompt-input');
      const query = input.value.trim();
      if (!query) return;
      // Placeholder — wire up to your backend/API here
      console.log('Prompt submitted:', query);
      input.value = '';
    }
  </script>
</body>
</html>
